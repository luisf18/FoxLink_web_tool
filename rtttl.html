function renderCArray(cdata) {

    const { name, values, itemsMeta, meta, warnings } = cdata;

    let out = "";

    // HEADER
    out += meta.useUint8
        ? `<span class="c-com">// uint8_t scaled</span>\n`
        : `<span class="c-com">// uint16_t raw</span>\n`;

    if (meta.useUint8) {
        out += `<span class="c-com">// scale: freq /= ${meta.scaleF}, time /= ${meta.scaleT}</span>\n`;
    }

    out += meta.normalize
        ? `<span class="c-com">// normalized: factor = ${meta.normFactor.toFixed(4)}</span>\n`
        : `<span class="c-com">// normalized: disabled</span>\n`;

    if (meta.offsetMin) {
        out += `<span class="c-com">// offset: freq -= ${meta.offsetValue}</span>\n`;

        if (warnings.offsetClamp) {
            out += `<span class="c-com">// ⚠ offset clamp</span>\n`;
        }
    }

    if (warnings.overflow) {
        out = `<span class="c-com">// ⚠ overflow detected</span>\n` + out;
    }

    // ARRAY
    out += `<span class="c-key">const ${meta.useUint8 ? "uint8_t" : "uint16_t"}</span> `;
    out += `<span class="c-name">${name}</span>`;
    out += `<span class="c-sym">[${values.length}]</span> = <span class="c-sym">{</span>\n`;

    for (let i = 0; i < itemsMeta.length; i++) {

        const item = itemsMeta[i];

        out += `    <span class="c-num">${item.freq}</span>, <span class="c-num">${item.time}</span>`;

        if (item.comment) {
            out += ` <span class="c-com">// ${item.comment}</span>`;
        }

        if (i < itemsMeta.length - 1) out += ",";
        out += "\n";
    }

    out += `<span class="c-sym">}</span>;`;

    return out;
}

const minF = 100;   // limite inferior (ajuste)
const maxF = 2000;  // limite superior

function logScale(freq) {
    if (freq <= 0) return 0;
    return (
        Math.log(freq / minF) /
        Math.log(maxF / minF)
    );
}

let graphMode = 0; // 0 = normal, 1 = centralizado

let currentNote = -1;

canvas.onclick = () => {

    draw(music);
};

function fixCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw(data) {

    fixCanvas();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const viewWidth  = canvas.clientWidth;
    const viewHeight = canvas.clientHeight;

    const freqs = data.map(n => n.freq).filter(f => f > 0);

    const minF = Math.min(...freqs, 100);
    const maxF = Math.max(...freqs, 2000);

    function logScale(freq) {
        if (freq <= 0) return 0;
        return Math.log(freq / minF) / Math.log(maxF / minF);
    }

    const gap = 1;

    let totalWidth = gap;
    data.forEach(n => {
        totalWidth += (n.time * 0.05) + gap;
    });

    const scaleX = totalWidth > viewWidth
        ? viewWidth / totalWidth
        : 1;

    let x = gap;


    if (graphMode === 1) {
        ctx.strokeStyle = "#cccccc";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(0, viewHeight / 2);
        ctx.lineTo(viewWidth, viewHeight / 2);
        ctx.stroke();
    }

    data.forEach((n, i) => {

        let w = (n.time * 0.05) * scaleX;

        let h = 0;

        if (n.freq > 0) {
            h = logScale(n.freq) * viewHeight;
        }

        h = Math.max(h, 10);

        ctx.fillStyle = (i === currentNote)
            ? "#25ff3e"
            : "#ff7310";

        const radius = Math.min( Math.min(w, h), 12) * 0.3;

        ctx.beginPath(); // 🔥 IMPORTANTE

        if (graphMode === 0) {
            ctx.roundRect(x, viewHeight - h, w, h, radius);
        } else {
            const center = viewHeight / 2;
            ctx.roundRect(x, center - h / 2, w, h, radius);
        }

        ctx.fill(); // 🔥 ESSENCIAL

        x += w + (gap * scaleX);
    });
}

function fillTable(data) {
    tableBody.innerHTML = "";

    data.forEach((n, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${i}</td>
            <td>${n.freq.toFixed(0)}</td>
            <td>${n.time.toFixed(0)}</td>
        `;
        tableBody.appendChild(tr);
    });
}

btn.onclick = async () => {

    if (isPlaying()) {
        stopAudio();

        btn.classList.remove("playing");
        btn.textContent = "Play";

        currentNote = -1;
        draw(music);

        return;
    }

    updateUI();

    btn.classList.add("playing");
    btn.textContent = "Pause";

    await playAudio(
        music,
        (i) => {
            currentNote = i;
            draw(music);
        }
    );

    btn.classList.remove("playing");
    btn.textContent = "Play";
    currentNote = -1;
    draw(music);
};

</script>

</body>
</html>
