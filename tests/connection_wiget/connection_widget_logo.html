<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FoxWire Widget</title>

<style>

/* ===== BASE ===== */
body{
    font-family: Arial;
    background:#eee;
}

/* ===== WIDGET ===== */
.widget-container{
    width:420px;
    height:140px;
    margin:30px auto;

    display:flex;
    flex-direction:column;

    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);

    overflow:visible;
}

/* ===== HEADER ===== */
.widget-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:10px;
    color:white;

    background:#ff7a00;
    border-radius:10px 10px 0 0;
}

/* ===== CONTROLS ===== */
.controls{
    display:flex;
    align-items:center;
    gap:5px;

    padding:5px;
    border-radius:8px;

    background:#00000040;
}

/* ===== BUTTONS ===== */
.btn{
    height:28px;
    border:none;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.btn-connect{
    width:40px;
    background:#ff3b3b;
    color:white;
}
.btn-connect.on{
    background:#22c55e;
}

.btn-scan{
    background:#ff7a00;
    color:white;
}

/* ===== SELECT SLOT ===== */
.select-slot{
    position:relative;
    width:150px;
    height:28px;
}

/* SELECT */
.select-box{
    position:absolute;
    inset:0;
    z-index:1;
}

.select-selected{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 8px;

    background:#f1f1f1;
    color:#222;

    border:1px solid #ccc;
    border-radius:6px;

    cursor:pointer;
    box-sizing:border-box;
}

.select-selected::after{
    content:"▼";
    font-size:10px;
    opacity:0.6;
}

/* DROPDOWN */
.select-items{
    position:absolute;
    top:110%;
    left:0;
    right:0;

    display:none;
    overflow:hidden;

    background:white;
    border-radius:6px;
    box-shadow:0 6px 12px rgba(0,0,0,0.2);

    z-index:999;
}

.select-items div{
    color:#222;
    padding:6px 8px;
    cursor:pointer;
}

.select-items div:hover{
    background:#ffe4cc;
}

.select-items .active{
    background:#22c55e;
    /*/color:white;/*/
}

/* ===== PROGRESS ===== */
.progress-box{
    position:absolute;
    inset:0;
    z-index:5;

    display:none;
    overflow:hidden;

    background:#fff3e6;
    border-radius:6px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#ff7a00;
}

/* ===== BADGE ===== */
.device-count{
    position:absolute;
    top:-6px;
    right:-6px;
    z-index:50;

    padding:2px 6px;
    font-size:10px;

    background:#22c55e;
    color:white;
    border-radius:10px;
}

/* ===== BODY ===== */
.widget-body{
    flex:1;
    padding:10px;
    font-size:12px;
}

/* ===== ANIMAÇÃO ===== */
.radar-icon svg{
    transform-origin:center;
}

.scanning .radar-icon svg{
    animation:spin 0.7s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0);}
    to{transform:rotate(360deg);}
}


.btn-connect{
    width:40px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ff3b3b;
    color:white;
}

.logo svg{
    width:25px;
    height:auto;
    display:block;
    /*/fill:rgba(255, 255, 255, 0.804);/*/
    fill:rgba(154, 0, 0, 0.804);
    transition:0.2s;
    transform:scale(1.1);
}

.logo.on svg{
    fill:rgba(18, 154, 0, 0.804);
}

</style>
</head>

<script>

/* ===== STATE ===== */
let connected = false;

/* ===== ELEMENTS ===== */
const connBtn   = document.getElementById("connBtn");
const scanBtn   = document.getElementById("scanBtn");
const statusEl  = document.getElementById("status");

const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");

const selectBox = document.getElementById("selectBox");
const selected  = document.getElementById("selected");
const items     = document.getElementById("selectItems");

const countEl   = document.getElementById("deviceCount");

/* ===== CONNECTION ===== */
connBtn.onclick = () => {
    connected = !connected;

    const logoCnn   = document.getElementById("connLogo");

    connBtn.classList.toggle("on", connected);
    logoCnn.classList.toggle("on", connected);

    statusEl.innerText =
        "Status: " + (connected ? "conectado" : "desconectado");

    resetDevices();
};

function resetDevices(){
    setCount(0);
    selected.innerText = "—";
}

/* ===== BADGE ===== */
function setCount(n){
    if(n <= 0){
        countEl.style.display = "none";
    }else{
        countEl.style.display = "block";
        countEl.innerText = n;
    }
}

/* ===== DROPDOWN ===== */
selected.onclick = () => {
    items.style.display = (items.style.display === "block") ? "none" : "block";
};

document.addEventListener("click", e => {
    if(!e.target.closest(".select-box")){
        items.style.display = "none";
    }
});

/* ===== SCAN ===== */
scanBtn.onclick = () => {

    if(!connected){
        alert("Conecte primeiro");
        return;
    }

    scanBtn.classList.add("scanning");

    progressBox.style.display = "block";
    selectBox.style.visibility = "hidden";

    progressBar.style.width = "0%";

    let p = 0;
    let found = 0;

    const t = setInterval(() => {

        p += 5;
        progressBar.style.width = p + "%";

        if(Math.random() > 0.7){
            found++;
            setCount(found);
        }

        if(p >= 100){
            clearInterval(t);

            progressBox.style.display = "none";
            selectBox.style.visibility = "visible";

            showDevices(found);

            scanBtn.classList.remove("scanning");
        }

    }, 40);
};

/* ===== DEVICES ===== */
function showDevices(total){

    items.innerHTML = "";

    if(total === 0){
        selected.innerText = "—";
        return;
    }

    selected.innerText = "Selecionar";

    for(let i=1;i<=total;i++){

        const opt = document.createElement("div");
        opt.innerText = "Device " + i;

        opt.onclick = () => {

            document.querySelectorAll(".select-items div")
                .forEach(el => el.classList.remove("active"));

            opt.classList.add("active");

            selected.innerText = opt.innerText;
            items.style.display = "none";
        };

        items.appendChild(opt);
    }
}

</script>
