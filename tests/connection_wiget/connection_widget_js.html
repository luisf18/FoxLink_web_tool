<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FoxWire Widget</title>

<link rel="stylesheet" href="../../css/foxwire_widget.css">

<style>

/* ===== BASE ===== */
body{
    font-family: Arial;
    background:#eee;
}

/* ===== CARD ===== */
.card{
    width:420px;
    height:140px;
    margin:30px auto;
    display:flex;
    flex-direction:column;
    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    overflow:visible;
}
.card-title{
    padding:10px 12px;
    font-size:10px;
    font-weight:bold;
    color:#333;
    border-bottom:1px solid #eee;
}
.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    color:white;
    background:#ff7a00;
    border-radius:10px 10px 0 0;
}

@keyframes gradientMove{

        background-position: 0% 50%;
    }
    50%{

    }
    100%{
        background-position: 0% 50%;
    }
}

<body>

<div class="card">

    <!-- CONTROLES -->
    <div class="card-header">

        <div>FoxWire</div>

        <div id="fx-connection"></div>

    </div>

    <!-- BODY -->
    <div class="card-body">
        <div id="status">Status: desconectado</div>
    </div>

</div>

<script type="module">

import { FoxWireWidget } from "../../js/foxwire_widget.js";

new FoxWireWidget(document.getElementById("fx-connection"), {
    width: "200px",
    height: "40px",
    use_title: true,
    //primary: "#0ea5e9",
    bg: "#f1f5f9"
});

</script>
