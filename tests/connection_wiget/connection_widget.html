<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FoxWire Widget</title>

<style>

/* ===== BASE ===== */
body{
    font-family: Arial;
    background:#eee;
}

/* ===== CARD ===== */
.card{
    width:420px;
    height:140px;
    margin:30px auto;
    display:flex;
    flex-direction:column;
    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    overflow:visible;
}
.card-title{
    padding:10px 12px;
    font-size:14px;
    font-weight:bold;
    color:#333;
    border-bottom:1px solid #eee;
}
.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    color:white;
    background:#ff7a00;
    border-radius:10px 10px 0 0;
}

.card-body{
    flex:1;
    padding:10px;
    font-size:12px;
}

/* ===== CONTROL BAR ===== */
.widget-controls{
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px;
    border-radius:8px;
    background:#00000040;
}

/* ===== BUTTONS ===== */
.btn{
    height:28px;
    border:none;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}
.btn-scan{
    /*/width:32px;/*/
    background:#ff7a00;
    color:white;
}
.btn-connect{
    width:40px;
    background:#ff3b3b;
    color:white;
}
.btn-connect.on{
    background:#22c55e;
}
.btn-connect svg{
    width:18px;
    height:18px;
}

/* ===== SELECT SLOT ===== */
.select-slot{
    position:relative;
    width:150px;
    height:28px;
}

/* SELECT */
.select-box{
    position:absolute;
    inset:0;
    z-index:1;
}

.select-selected{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 8px;

    background:#f1f1f1;
    color:#222;

    border:1px solid #ccc;
    border-radius:6px;
    cursor:pointer;
}

.select-selected::after{
    content:"▼";
    font-size:10px;
    opacity:0.6;
}

/* DROPDOWN */
.select-items{
    position:absolute;
    top:110%;
    left:0;
    right:0;

    display:none;

    background:white;
    border-radius:6px;
    box-shadow:0 6px 12px rgba(0,0,0,0.2);
    z-index:999;
}

.select-items div{
    color:#222;
    border-radius:6px;
    padding:6px 8px;
    cursor:pointer;
}

.select-items div:hover{
    background:#ffe4cc;
}

.select-items .active{
    background:#22c55e;
}

/* ===== PROGRESS ===== */
.progress-box{
    position:absolute;
    inset:0;
    z-index:5;
    display:none;
    background:#fff3e6;
    border-radius:6px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#ff7a00;
}

/* ===== BADGE ===== */
.device-count{
    position:absolute;
    top:-6px;
    right:-6px;
    z-index:50;

    padding:2px 6px;
    font-size:10px;

    background:#22c55e;
    color:white;
    border-radius:10px;
}

/* ===== ANIMATION ===== */
.radar-icon svg{
    transform-origin:center;
}

.scanning .radar-icon svg{
    animation:spin 0.7s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0);}
    to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="card">

    <!-- CONTROLES -->
    <div class="card-header">

        <div>FoxWire</div>

        <div class="widget-controls">

            <!-- CONNECT -->
            <button class="btn btn-connect" id="connBtn">

                <!-- OFF -->
                <svg id="iconOff" viewBox="0 0 24 24">
                    <path d="M12 2v10" stroke="white" stroke-width="2"/>
                    <circle cx="12" cy="14" r="8" stroke="white" stroke-width="2" fill="none"/>
                </svg>

                <!-- ON -->
                <svg id="iconOn" viewBox="0 0 24 24" style="display:none;">
                    <circle cx="12" cy="12" r="10" fill="white"/>
                    <path d="M8 12l3 3 5-6" stroke="#22c55e" stroke-width="2" fill="none"/>
                </svg>

            </button>

            <!-- SCAN -->
            <button class="btn btn-scan" id="scanBtn">
                <div class="radar-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M12 12 L19 9" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
            </button>

            <!-- SELECT -->
            <div class="select-slot">

                <div class="progress-box" id="progressBox">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="select-box" id="selectBox">
                    <div class="select-selected" id="selected">—</div>
                    <div class="select-items" id="selectItems"></div>
                </div>

                <div class="device-count" id="deviceCount" style="display:none;">0</div>

            </div>

        </div>
    </div>

    <!-- BODY -->
    <div class="card-body">
        <div id="status">Status: desconectado</div>
    </div>

</div>

<script>

/* ===== STATE ===== */
let connected = false;

/* ===== ELEMENTS ===== */
const connBtn   = document.getElementById("connBtn");
const scanBtn   = document.getElementById("scanBtn");
const statusEl  = document.getElementById("status");

const iconOn  = document.getElementById("iconOn");
const iconOff = document.getElementById("iconOff");

const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");

const selectBox = document.getElementById("selectBox");
const selected  = document.getElementById("selected");
const items     = document.getElementById("selectItems");

const countEl   = document.getElementById("deviceCount");

/* ===== CONNECTION ===== */
connBtn.onclick = () => {
    connected = !connected;

    connBtn.classList.toggle("on", connected);

    iconOn.style.display  = connected ? "block" : "none";
    iconOff.style.display = connected ? "none" : "block";

    statusEl.innerText =
        "Status: " + (connected ? "conectado" : "desconectado");

    resetDevices();
};

function resetDevices(){
    setCount(0);
    selected.innerText = "—";
}

/* ===== BADGE ===== */
function setCount(n){
    countEl.style.display = n > 0 ? "block" : "none";
    countEl.innerText = n;
}

/* ===== DROPDOWN ===== */
selected.onclick = () => {
    items.style.display = items.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", e => {
    if(!e.target.closest(".select-box")){
        items.style.display = "none";
    }
});

/* ===== SCAN ===== */
scanBtn.onclick = () => {

    if(!connected){
        alert("Conecte primeiro");
        return;
    }

    scanBtn.classList.add("scanning");

    progressBox.style.display = "block";
    selectBox.style.visibility = "hidden";

    progressBar.style.width = "0%";

    let p = 0;
    let found = 0;

    const t = setInterval(() => {

        p += 5;
        progressBar.style.width = p + "%";

        if(Math.random() > 0.7){
            found++;
            setCount(found);
        }

        if(p >= 100){
            clearInterval(t);

            progressBox.style.display = "none";
            selectBox.style.visibility = "visible";

            showDevices(found);

            scanBtn.classList.remove("scanning");
        }

    }, 40);
};

/* ===== DEVICES ===== */
function showDevices(total){

    items.innerHTML = "";

    if(total === 0){
        selected.innerText = "—";
        return;
    }

    selected.innerText = "Selecionar";

    for(let i=1;i<=total;i++){

        const opt = document.createElement("div");
        opt.innerText = "Device " + i;

        opt.onclick = () => {
            document.querySelectorAll(".select-items div")
                .forEach(el => el.classList.remove("active"));

            opt.classList.add("active");
            selected.innerText = opt.innerText;
            items.style.display = "none";
        };

        items.appendChild(opt);
    }
}

</script>

</body>
</html>
