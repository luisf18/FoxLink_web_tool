<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Motor DC Curves</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        font-family:Inter, Arial, sans-serif;
        background:#f6f6f7;
        color:#222;
    }

    .container{
        max-width:1200px;
        margin:auto;
        padding:24px;
    }

    .header{
        margin-bottom:24px;
    }

    .title{
        font-size:34px;
        font-weight:700;
        color:#ff7a00;
        margin-bottom:8px;
    }

    .subtitle{
        color:#666;
        font-size:15px;
    }

    .cards{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
        gap:20px;
        margin-bottom:20px;
    }

    .card{
        background:white;
        border-radius:18px;
        padding:22px;
        box-shadow:
            0 2px 8px rgba(0,0,0,0.05),
            0 1px 2px rgba(0,0,0,0.04);
        border:1px solid #ececec;
    }

    .card h2{
        margin-top:0;
        margin-bottom:18px;
        font-size:20px;
        color:#ff7a00;
    }

    .input-group{
        margin-bottom:16px;
    }

    label{
        display:block;
        margin-bottom:6px;
        font-size:14px;
        font-weight:600;
        color:#555;
    }

    input{
        width:100%;
        border:none;
        background:#f5f5f5;
        border-radius:12px;
        padding:14px;
        font-size:15px;
        transition:0.2s;
    }

    input:focus{
        outline:none;
        background:white;
        box-shadow:0 0 0 2px #ffb36a;
    }

    .button{
        width:100%;
        border:none;
        border-radius:14px;
        padding:16px;
        background:#ff7a00;
        color:white;
        font-size:16px;
        font-weight:700;
        cursor:pointer;
        transition:0.2s;
        margin-bottom:24px;
    }

    .button:hover{
        background:#e86f00;
        transform:translateY(-1px);
    }

    .results{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:16px;
        margin-bottom:24px;
    }

    .result-box{
        background:white;
        border-radius:16px;
        padding:18px;
        border:1px solid #ececec;
        box-shadow:
            0 2px 8px rgba(0,0,0,0.04);
    }

    .result-label{
        color:#777;
        font-size:13px;
        margin-bottom:8px;
    }

    .result-value{
        font-size:28px;
        font-weight:700;
        color:#ff7a00;
    }

    .chart-card{
        background:white;
        border-radius:20px;
        padding:20px;
        border:1px solid #ececec;
        box-shadow:
            0 2px 8px rgba(0,0,0,0.04);
    }

    canvas{
        width:100%;
        max-height:550px;
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">Motor DC Curves</div>
        <div class="subtitle">
            Calculadora e gráficos característicos de motores DC
        </div>
    </div>

    <div class="cards">

        <div class="card">
            <h2>Sem carga</h2>

            <div class="input-group">
                <label>Velocidade sem carga (RPM)</label>
                <input type="number" id="rpm_no_load" value="12000">
            </div>

            <div class="input-group">
                <label>Tensão (V)</label>
                <input type="number" id="voltage" value="12">
            </div>

            <div class="input-group">
                <label>Corrente sem carga (A)</label>
                <input type="number" id="current_no_load" value="0.5">
            </div>
        </div>

        <div class="card">
            <h2>Stall</h2>

            <div class="input-group">
                <label>Corrente de stall (A)</label>
                <input type="number" id="current_stall" value="20">
            </div>

            <div class="input-group">
                <label>Torque de stall (N.m)</label>
                <input type="number" id="torque_stall" value="0.8">
            </div>
        </div>

    </div>

    <button class="button" onclick="calculateMotor()">
        Calcular Curvas
    </button>

    <div class="results">

        <div class="result-box">
            <div class="result-label">Velocidade sem carga</div>
            <div class="result-value" id="rpmResult">0 RPM</div>
        </div>

        <div class="result-box">
            <div class="result-label">Torque stall</div>
            <div class="result-value" id="torqueResult">0</div>
        </div>

        <div class="result-box">
            <div class="result-label">Corrente stall</div>
            <div class="result-value" id="currentResult">0 A</div>
        </div>

        <div class="result-box">
            <div class="result-label">Eficiência máxima</div>
            <div class="result-value" id="efficiencyResult">0%</div>
        </div>

    </div>

    <div class="chart-card">
        <canvas id="motorChart"></canvas>
    </div>

</div>

<script>

let chart;

function calculateMotor(){

    const rpmNoLoad =
        parseFloat(document.getElementById("rpm_no_load").value);

    const voltage =
        parseFloat(document.getElementById("voltage").value);

    const currentNoLoad =
        parseFloat(document.getElementById("current_no_load").value);

    const currentStall =
        parseFloat(document.getElementById("current_stall").value);

    const torqueStall =
        parseFloat(document.getElementById("torque_stall").value);

    const points = 120;

    let torque = [];
    let speed = [];
    let current = [];
    let efficiency = [];
    let power = [];

    let maxEfficiency = 0;

    for(let i = 0; i <= points; i++){

        const t = torqueStall * (i / points);

        const rpm =
            rpmNoLoad * (1 - (t / torqueStall));

        const cur =
            currentNoLoad +
            (currentStall - currentNoLoad) *
            (t / torqueStall);

        const omega =
            rpm * 2 * Math.PI / 60;

        const mechPower =
            t * omega;

        const elecPower =
            voltage * cur;

        const eff =
            elecPower > 0
            ? (mechPower / elecPower) * 100
            : 0;

        if(eff > maxEfficiency){
            maxEfficiency = eff;
        }

        torque.push(t.toFixed(3));
        speed.push(rpm);
        current.push(cur);
        efficiency.push(eff);
        power.push(mechPower);
    }

    document.getElementById("rpmResult").innerText =
        rpmNoLoad.toFixed(0) + " RPM";

    document.getElementById("torqueResult").innerText =
        torqueStall.toFixed(2) + " N.m";

    document.getElementById("currentResult").innerText =
        currentStall.toFixed(1) + " A";

    document.getElementById("efficiencyResult").innerText =
        maxEfficiency.toFixed(1) + "%";

    const ctx =
        document.getElementById("motorChart");

    if(chart){
        chart.destroy();
    }

    chart = new Chart(ctx, {

        type:"line",

        data:{
            labels:torque,

            datasets:[

                {
                    label:"Velocidade (RPM)",
                    data:speed,
                    borderColor:"#ff7a00",
                    backgroundColor:"#ff7a00",
                    borderWidth:3,
                    tension:0.25,
                    pointRadius:0,
                    yAxisID:"y"
                },

                {
                    label:"Corrente (A)",
                    data:current,
                    borderColor:"#444",
                    backgroundColor:"#444",
                    borderWidth:2,
                    tension:0.25,
                    pointRadius:0,
                    yAxisID:"y1"
                },

                {
                    label:"Eficiência (%)",
                    data:efficiency,
                    borderColor:"#ffb000",
                    backgroundColor:"#ffb000",
                    borderWidth:2,
                    tension:0.25,
                    pointRadius:0,
                    yAxisID:"y1"
                },

                {
                    label:"Potência Mecânica (W)",
                    data:power,
                    borderColor:"#999",
                    backgroundColor:"#999",
                    borderWidth:2,
                    tension:0.25,
                    pointRadius:0,
                    yAxisID:"y1"
                }

            ]
        },

        options:{

            responsive:true,

            interaction:{
                mode:"index",
                intersect:false
            },

            plugins:{
                legend:{
                    labels:{
                        usePointStyle:true
                    }
                }
            },

            scales:{

                x:{
                    title:{
                        display:true,
                        text:"Torque (N.m)"
                    },
                    grid:{
                        color:"#efefef"
                    }
                },

                y:{
                    type:"linear",
                    position:"left",

                    title:{
                        display:true,
                        text:"Velocidade (RPM)"
                    },

                    grid:{
                        color:"#efefef"
                    }
                },

                y1:{
                    type:"linear",
                    position:"right",

                    title:{
                        display:true,
                        text:"Corrente / Eficiência / Potência"
                    },

                    grid:{
                        drawOnChartArea:false
                    }
                }
            }
        }
    });
}

calculateMotor();

</script>

</body>
</html>
